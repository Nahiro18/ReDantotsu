name: Build APK and Notify Discord

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - l10n_dev_crowdin
      - custom-download-location
    paths-ignore:
      - '**/README.md'
    tags:
    - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: true
      SKIP_BUILD: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: gradle

    - name: Make gradlew executable
      if: ${{ env.SKIP_BUILD != 'true' }}
      run: chmod +x ./gradlew

    - name: Build with Gradle (F-Droid Flavor)
      if: ${{ env.SKIP_BUILD != 'true' }}
      run: ./gradlew assembleFdroidAlpha

    - name: Upload a Build Artifact
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/upload-artifact@v4
      with:
          name: ReDantotsu
          retention-days: 5
          compression-level: 9
          path: "app/build/outputs/apk/fdroid/alpha/ReDantotsu-universal-alpha.apk"
