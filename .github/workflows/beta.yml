name: Build APK and Notify Discord

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - l10n_dev_crowdin
      - custom-download-location
    paths-ignore:
      - '**/README.md'
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CI: true
      SKIP_BUILD: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: gradle

    - name: Make gradlew executable
      if: ${{ env.SKIP_BUILD != 'true' }}
      run: chmod +x ./gradlew

    - name: Set up release keystore
      if: ${{ env.SKIP_BUILD != 'true' }}
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

    - name: Build with Gradle (F-Droid Flavor)
      if: ${{ env.SKIP_BUILD != 'true' }}
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleFdroidAlpha

    - name: Upload a Build Artifact
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/upload-artifact@v4
      with:
          name: ReDantotsu
          retention-days: 5
          compression-level: 9
          path: "app/build/outputs/apk/fdroid/alpha/*.apk"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/fdroid/alpha/*.apk
        generate_release_notes: true

name: Build APK and Notify Discord

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - l10n_dev_crowdin
      - custom-download-location
    paths-ignore:
      - '**/README.md'
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CI: true
      SKIP_BUILD: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: gradle

    - name: Make gradlew executable
      if: ${{ env.SKIP_BUILD != 'true' }}
      run: chmod +x ./gradlew

    - name: Set up release keystore
      if: ${{ env.SKIP_BUILD != 'true' }}
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

    - name: Build with Gradle (F-Droid Flavor)
      if: ${{ env.SKIP_BUILD != 'true' }}
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleFdroidAlpha

    - name: Upload a Build Artifact
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/upload-artifact@v4
      with:
          name: ReDantotsu
          retention-days: 5
          compression-level: 9
          path: "app/build/outputs/apk/fdroid/alpha/*.apk"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/fdroid/alpha/*.apk
        generate_release_notes: true

    - name: Notify Discord (Beta Release)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        WEBHOOK_BETA: "https://discord.com/api/webhooks/1540389188581720144/6ghtfxfX_oignakw-UaTf5WTaeHg3EJ_zpdEzPI706HkOT3m808l5sdN3wtfaPaDhEP5"
        ROLE_ID_BETA: "1540391101234552852"
        RELEASE_TAG: ${{ github.ref_name }}
        REPO_NAME: ${{ github.repository }}
      run: |
        # 1. Fetch release details generated by softprops/action-gh-release
        RELEASE_DATA=$(curl -s "https://api.github.com/repos/$REPO_NAME/releases/tags/$RELEASE_TAG")
        RELEASE_BODY=$(echo "$RELEASE_DATA" | jq -r '.body // "No release notes provided."')
        RELEASE_URL=$(echo "$RELEASE_DATA" | jq -r '.html_url')
        ASSETS=$(echo "$RELEASE_DATA" | jq '.assets')

        # 2. Format download links and file sizes
        ASSET_LIST=$(echo "$ASSETS" | jq -r '.[] | "🔹 [Download](\(.browser_download_url)) | \((.size / 1048576 * 100 | round / 100)) MB | **\(.name)**"')

        # 3. Assemble JSON payload
        PAYLOAD=$(jq -n \
          --arg content "<@&$ROLE_ID_BETA>" \
          --arg username "Beta Update" \
          --arg title "🧪 New Beta Release: $RELEASE_TAG" \
          --arg desc "$RELEASE_BODY" \
          --arg assets_text "$RELEASE_TAG Released\n$ASSET_LIST" \
          --arg footer "Version $RELEASE_TAG" \
          --arg url "$RELEASE_URL" \
          --argjson color 16753920 \
          '{
            username: $username,
            content: ($content + "\n\n" + $assets_text),
            embeds: [{
              title: $title,
              description: $desc,
              url: $url,
              color: $color,
              footer: { text: $footer }
            }]
          }')

        # 4. Post to Discord
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "$PAYLOAD" \
             "$WEBHOOK_BETA"
