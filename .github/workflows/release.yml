name: Build APK and Notify Discord

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - l10n_dev_crowdin
      - custom-download-location
    paths-ignore:
      - '**/README.md'
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CI: true
      SKIP_BUILD: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: gradle

    - name: Make gradlew executable
      if: ${{ env.SKIP_BUILD != 'true' }}
      run: chmod +x ./gradlew

    - name: Set up release keystore
      if: ${{ env.SKIP_BUILD != 'true' }}
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

    - name: Build with Gradle (F-Droid Flavor)
      if: ${{ env.SKIP_BUILD != 'true' }}
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleFdroidAlpha

    - name: Upload a Build Artifact
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/upload-artifact@v4
      with:
          name: ReDantotsu
          retention-days: 5
          compression-level: 9
          path: "app/build/outputs/apk/fdroid/alpha/*.apk"

    - name: Get release notes from annotated tag
      if: startsWith(github.ref, 'refs/tags/v')
      id: notes
      env:
        REPO_NAME: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO_NAME/git/ref/tags/$GITHUB_REF_NAME" | jq -r '.object.sha // empty')
        NOTES=""
        if [ -n "$TAG_SHA" ]; then
          NOTES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO_NAME/git/tags/$TAG_SHA" | jq -r '.message // empty')
        fi
        {
          echo 'NOTES<<TAGMSG'
          echo "$NOTES"
          echo TAGMSG
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/fdroid/alpha/*.apk
        generate_release_notes: false
        body: ${{ steps.notes.outputs.NOTES }}

    - name: Notify Discord (Release)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        WEBHOOK_RELEASE: "https://discordapp.com/api/webhooks/1540855125893972131/OKQDvYiqPbkMLYCi0cXrIjV0sQjcodJrpdYmdCBn0muITJ7p1Ze7BKPpqzm2NxM7vP53"
        RELEASE_TAG: ${{ github.ref_name }}
        REPO_NAME: ${{ github.repository }}
      run: |
        sleep 10
        RELEASE_URL="https://github.com/$REPO_NAME/releases/tag/$RELEASE_TAG"
        ASSET_LIST=""
        for i in 1 2 3; do
          ASSET_LIST=$(curl -s "https://api.github.com/repos/$REPO_NAME/releases/tags/$RELEASE_TAG" | jq -r '.assets[]? | "\u2022 [Download](\(.browser_download_url)) | \((.size / 1048576 * 100 | round / 100)) MB | **\(.name)**"')
          if [ -n "$ASSET_LIST" ]; then break; fi
          sleep 10
        done
        CONTENT="**RELEASE ${RELEASE_TAG}** - **Whats New?** ${RELEASE_URL}"$'\n\n'"${ASSET_LIST}"$'\n\n'"Report bugs in <#1539645809547550782>"
        PAYLOAD=$(jq -n \
          --arg username "ReDantotsu Releases" \
          --arg title "\ud83c\udf89 New Release: $RELEASE_TAG" \
          --arg content "$CONTENT" \
          --arg footer "Version $RELEASE_TAG" \
          --arg url "$RELEASE_URL" \
          --argjson color 16753920 \
          '{
            username: $username,
            content: $content,
            embeds: [{
              title: $title,
              url: $url,
              color: $color,
              footer: { text: $footer }
            }]
          }')

        # 5. Post to Discord
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "$PAYLOAD" \
             "$WEBHOOK_RELEASE"
